<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>МФЦ — маршруты М1–М5</title>
<script>window.YA_SCRIPT_ERROR="";</script><script src="https://api-maps.yandex.ru/v3/?apikey=ae1ad0d8-c1e7-4617-9b5f-782af5dfa35d&lang=ru_RU" onerror="window.YA_SCRIPT_ERROR='Не удалось загрузить api-maps.yandex.ru'"></script>
<style>
:root{--panel:#fff;--text:#111827;--muted:#667085}
*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f6;color:var(--text);overflow:hidden}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:20;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;max-width:620px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px #0002}
.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.title{font-size:18px;font-weight:800;line-height:1.15}.sub{font-size:12px;color:var(--muted);margin-top:4px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.filters button{border:0;border-radius:999px;padding:8px 12px;color:#fff;font-weight:800;font-size:13px;box-shadow:0 1px 4px #0002}.filters button.off{opacity:.28}
.status{margin-top:9px;font-size:12px;color:var(--muted)}
.card{position:absolute;z-index:30;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));max-width:620px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 8px 30px #0003;display:none}
.card.show{display:block}.card .close{position:absolute;right:10px;top:8px;border:0;background:#f2f4f7;border-radius:50%;width:30px;height:30px;font-size:18px}.card h2{font-size:17px;margin:0 38px 5px 0}.card p{font-size:13px;margin:4px 0;color:#344054}.check{margin-top:9px;padding-top:9px;border-top:1px solid #eaecf0;font-size:12px}.ok{color:#15803d}.warn{color:#b45309}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px #0005;cursor:pointer}
.pin span{transform:rotate(45deg);color:#fff;font-weight:900;font-size:12px}
.legend{font-size:11px;color:#667085;margin-top:7px}
@media(max-width:680px){.panel{max-width:none}.card{max-width:none}.title{font-size:16px}.filters button{padding:7px 10px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="head"><div><div class="title">МФЦ · зоны обслуживания</div><div class="sub">Яндекс Карты · 51 объект · глобальный расчёт 51×51 · build 13</div></div></div>
  <div class="filters" id="filters"></div>
  <div class="status" id="status">Загружаю Яндекс Карты…</div>
  <div class="legend">Нажми на точку — покажу исходный адрес, совпадение Яндекса и координаты.</div>
</div>
<div class="card" id="card"><button class="close" id="closeCard">×</button><div id="cardBody"></div></div>
<script src="./data.js?v=13"></script>
<script src="./map.js?v=13"></script>
</body></html>
