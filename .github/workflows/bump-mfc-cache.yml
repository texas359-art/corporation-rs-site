name: Bump MFC Map Cache
on:
  push:
    paths:
      - '.github/workflows/bump-mfc-cache.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump route cards build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mfc-map/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("build 10","build 11")
          s=s.replace("data.js?v=10","data.js?v=11")
          s=s.replace("map.js?v=10","map.js?v=11")
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mfc-map/index.html
          git commit -m "Publish route cards build 11"
          git push
