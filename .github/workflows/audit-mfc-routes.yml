name: Audit MFC Route Travel Times
on:
  push:
    paths:
      - '.github/workflows/audit-mfc-routes.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find route boundary misassignments on road network
        shell: bash
        run: |
          cat > /tmp/audit.py <<'PY'
          import re,json,urllib.request,math
          m=open("mfc-map/map.js",encoding="utf-8").read()
          d=open("mfc-map/data.js",encoding="utf-8").read()
          block=re.search(r'const COORDS=\{(.*?)\};',m,re.S).group(1)
          coords={}
          for n,lat,lon in re.findall(r'(\d+):\[([0-9.]+),([0-9.]+)\]',block):
              coords[int(n)]=(float(lat),float(lon))
          arr=json.loads(re.search(r'window\.MFC=(\[.*\]);\s*$',d,re.S).group(1))
          nums=[r[0] for r in arr]
          bynum={r[0]:r for r in arr}
          teamof={r[0]:r[1] for r in arr}
          teams={t:[r[0] for r in arr if r[1]==t] for t in ["М1","М2","М3","М4","М5"]}
          coordstr=";".join(f"{coords[n][1]},{coords[n][0]}" for n in nums)
          url="https://router.project-osrm.org/table/v1/driving/"+coordstr+"?annotations=duration"
          req=urllib.request.Request(url,headers={"User-Agent":"MFC-route-boundary-audit/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:data=json.load(r)
          dur=data["durations"]; idx={n:i for i,n in enumerate(nums)}
          def avg_to(n,members):
              vals=[dur[idx[n]][idx[x]] for x in members if x!=n and dur[idx[n]][idx[x]] is not None]
              return sum(vals)/len(vals) if vals else 999999
          candidates=[]
          for n in nums:
              own=teamof[n]
              ownavg=avg_to(n,teams[own])
              alts=[]
              for t,mem in teams.items():
                  if t==own: continue
                  alts.append((avg_to(n,mem),t))
              alts.sort()
              bestavg,best=alts[0]
              delta=(ownavg-bestavg)/60
              if delta>1:
                  candidates.append((delta,n,own,best,ownavg/60,bestavg/60))
          candidates.sort(reverse=True)
          print("=== TOP BOUNDARY CANDIDATES ===")
          for delta,n,own,best,oa,ba in candidates[:20]:
              r=bynum[n]
              print(f"MOVE?|{n}|{own}->{best}|own_avg={oa:.1f}m|alt_avg={ba:.1f}m|gain={delta:.1f}m|{r[2]}|{r[3]}")
          print("=== ROUTE AVERAGE INTERNAL TIMES ===")
          for t,mem in teams.items():
              vals=[]
              for a in mem:
                  for b in mem:
                      if a<b and dur[idx[a]][idx[b]] is not None: vals.append(dur[idx[a]][idx[b]])
              vals.sort()
              mean=sum(vals)/len(vals)/60
              p90=vals[int(.9*(len(vals)-1))]/60
              print(f"TEAM|{t}|n={len(mem)}|mean_pair={mean:.1f}m|p90={p90:.1f}m|max={max(vals)/60:.1f}m")
          PY
          python3 /tmp/audit.py
