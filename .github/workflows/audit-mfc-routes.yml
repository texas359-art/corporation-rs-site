name: Audit MFC Route Travel Times
on:
  push:
    paths:
      - '.github/workflows/audit-mfc-routes.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate boundary move scenarios
        shell: bash
        run: |
          cat > /tmp/audit.py <<'PY'
          import re,json,urllib.request,copy
          m=open("mfc-map/map.js",encoding="utf-8").read()
          d=open("mfc-map/data.js",encoding="utf-8").read()
          block=re.search(r'const COORDS=\{(.*?)\};',m,re.S).group(1)
          coords={int(n):(float(lat),float(lon)) for n,lat,lon in re.findall(r'(\d+):\[([0-9.]+),([0-9.]+)\]',block)}
          arr=json.loads(re.search(r'window\.MFC=(\[.*\]);\s*$',d,re.S).group(1))
          nums=[r[0] for r in arr]; idx={n:i for i,n in enumerate(nums)}
          base={t:[r[0] for r in arr if r[1]==t] for t in ["М1","М2","М3","М4","М5"]}
          coordstr=";".join(f"{coords[n][1]},{coords[n][0]}" for n in nums)
          req=urllib.request.Request("https://router.project-osrm.org/table/v1/driving/"+coordstr+"?annotations=duration",headers={"User-Agent":"MFC-route-scenario-audit/1.0"})
          with urllib.request.urlopen(req,timeout=120) as r:data=json.load(r)
          dur=data["durations"]
          def metrics(mem):
              vals=[]
              for i,a in enumerate(mem):
                  for b in mem[i+1:]:
                      x=dur[idx[a]][idx[b]]
                      if x is not None: vals.append(x/60)
              vals.sort()
              return len(mem),sum(vals)/len(vals),vals[int(.9*(len(vals)-1))],max(vals)
          def score(cl):
              # transport load proxy: addresses * mean intra-route road minutes
              return sum(metrics(mem)[0]*metrics(mem)[1] for mem in cl.values())
          scenarios={
            "CURRENT":[],
            "MOVE13":[(13,"М2","М1")],
            "MOVE11":[(11,"М2","М1")],
            "MOVE13_11":[(13,"М2","М1"),(11,"М2","М1")],
            "MOVE41":[(41,"М3","М1")],
            "MOVE13_41":[(13,"М2","М1"),(41,"М3","М1")],
            "MOVE13_11_41":[(13,"М2","М1"),(11,"М2","М1"),(41,"М3","М1")],
            "BAL45":[(13,"М2","М1"),(11,"М2","М1"),(45,"М1","М5")],
            "BAL5":[(13,"М2","М1"),(11,"М2","М1"),(5,"М1","М5")],
            "BAL6":[(13,"М2","М1"),(11,"М2","М1"),(6,"М1","М5")],
            "BAL9":[(13,"М2","М1"),(11,"М2","М1"),(9,"М1","М5")],
          }
          for name,moves in scenarios.items():
              cl=copy.deepcopy(base)
              for n,a,b in moves:
                  cl[a].remove(n);cl[b].append(n)
              print(f"SCENARIO|{name}|score={score(cl):.1f}")
              for t in ["М1","М2","М3","М4","М5"]:
                  n,mean,p90,mx=metrics(cl[t])
                  print(f"METRIC|{name}|{t}|n={n}|mean={mean:.1f}|p90={p90:.1f}|max={mx:.1f}|load={n*mean:.1f}")
          PY
          python3 /tmp/audit.py
