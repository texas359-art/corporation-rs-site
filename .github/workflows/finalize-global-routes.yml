name: Finalize Global MFC Routes
on:
  push:
    paths:
      - '.github/workflows/finalize-global-routes.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute exact shortest open path inside each final cluster
        shell: bash
        run: |
          cat > /tmp/final.py <<'PY'
          import re,json,urllib.request,math
          m=open("mfc-map/map.js",encoding="utf-8").read()
          d=open("mfc-map/data.js",encoding="utf-8").read()
          block=re.search(r'const COORDS=\{(.*?)\};',m,re.S).group(1)
          coords={int(n):(float(lat),float(lon)) for n,lat,lon in re.findall(r'(\d+):\[([0-9.]+),([0-9.]+)\]',block)}
          arr=json.loads(re.search(r'window\.MFC=(\[.*\]);\s*$',d,re.S).group(1))
          bynum={r[0]:r for r in arr}
          routes={
            "М1":[3,4,5,7,8,42,43,44,45,46],
            "М2":[14,16,17,18,19,24,26,47,48,49],
            "М3":[20,21,22,23,25,27,28,33,50,51],
            "М4":[29,30,31,32,34,35,36,37,38,39,40],
            "М5":[1,2,6,9,10,11,12,13,15,41],
          }
          for t,nodes in routes.items():
              coordstr=";".join(f"{coords[n][1]},{coords[n][0]}" for n in nodes)
              req=urllib.request.Request("https://router.project-osrm.org/table/v1/driving/"+coordstr+"?annotations=duration,distance",headers={"User-Agent":"MFC-final-global-path/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:data=json.load(r)
              raw=data["durations"]
              n=len(nodes)
              # symmetric planning matrix
              W=[[0]*n for _ in range(n)]
              for i in range(n):
                  for j in range(n):
                      W[i][j]=0 if i==j else (raw[i][j]+raw[j][i])/120
              # Exact shortest Hamiltonian OPEN path via Held-Karp.
              INF=10**18
              dp={}
              parent={}
              for i in range(n):
                  dp[(1<<i,i)]=0.0
              for mask in range(1,1<<n):
                  for j in range(n):
                      key=(mask,j)
                      if key not in dp:continue
                      v=dp[key]
                      for k in range(n):
                          if mask>>k&1:continue
                          nm=mask|1<<k
                          nv=v+W[j][k]
                          nk=(nm,k)
                          if nv<dp.get(nk,INF):
                              dp[nk]=nv;parent[nk]=j
              full=(1<<n)-1
              end=min(range(n),key=lambda j:dp[(full,j)])
              total=dp[(full,end)]
              path=[]
              mask=full;j=end
              while True:
                  path.append(j)
                  if mask==(1<<j):break
                  pj=parent[(mask,j)]
                  mask^=1<<j;j=pj
              path=path[::-1]
              order=[nodes[i] for i in path]
              vals=[]
              for i in range(n):
                  for j in range(i+1,n):
                      vals.append((W[i][j],nodes[i],nodes[j]))
              vals.sort()
              mean=sum(x[0] for x in vals)/len(vals)
              p90=vals[int(.9*(len(vals)-1))][0]
              mx,a,b=max(vals)
              seg=[]
              for x,y in zip(path,path[1:]):
                  seg.append((W[x][y],nodes[x],nodes[y]))
              print(f"ROUTE|{t}|n={n}|open_path={total:.1f}m|mean_pair={mean:.1f}m|p90={p90:.1f}m|max={mx:.1f}m|maxpair={a}-{b}")
              print(f"ORDER|{t}|"+",".join(map(str,order)))
              print("ORDER_NAMES|%s|%s"%(t," -> ".join(f"{num}:{bynum[num][2]}" for num in order)))
              for sec,a,b in sorted(seg,reverse=True)[:3]:
                  print(f"LONGSEG|{t}|{a}->{b}|{sec:.1f}m")
          PY
          python3 /tmp/final.py
