name: Finalize Global MFC Routes
on:
  push:
    paths:
      - '.github/workflows/finalize-global-routes.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute exact shortest open path for final coherent routes
        shell: bash
        run: |
          cat > /tmp/final.py <<'PY'
          import re,json,urllib.request
          m=open("mfc-map/map.js",encoding="utf-8").read()
          d=open("mfc-map/data.js",encoding="utf-8").read()
          block=re.search(r'const COORDS=\{(.*?)\};',m,re.S).group(1)
          coords={int(n):(float(lat),float(lon)) for n,lat,lon in re.findall(r'(\d+):\[([0-9.]+),([0-9.]+)\]',block)}
          arr=json.loads(re.search(r'window\.MFC=(\[.*\]);\s*$',d,re.S).group(1));bynum={r[0]:r for r in arr}
          routes={
            "М1":[3,4,5,7,8,42,43,44,45,46],
            "М2":[14,16,17,18,19,24,48,49],
            "М3":[20,21,22,23,25,26,27,28,33,47,50,51],
            "М4":[29,30,31,32,34,35,36,37,38,39,40],
            "М5":[1,2,6,9,10,11,12,13,15,41],
          }
          for t,nodes in routes.items():
              coordstr=";".join(f"{coords[n][1]},{coords[n][0]}" for n in nodes)
              req=urllib.request.Request("https://router.project-osrm.org/table/v1/driving/"+coordstr+"?annotations=duration,distance",headers={"User-Agent":"MFC-final-coherent-path/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:data=json.load(r)
              raw=data["durations"];dist=data["distances"];N=len(nodes)
              W=[[0]*N for _ in range(N)]
              for i in range(N):
                  for j in range(N):W[i][j]=0 if i==j else (raw[i][j]+raw[j][i])/120
              INF=1e99;dp={};par={}
              for i in range(N):dp[(1<<i,i)]=0.
              for mask in range(1,1<<N):
                  for j in range(N):
                      if (mask,j) not in dp:continue
                      v=dp[(mask,j)]
                      for k in range(N):
                          if mask>>k&1:continue
                          nk=(mask|1<<k,k);nv=v+W[j][k]
                          if nv<dp.get(nk,INF):dp[nk]=nv;par[nk]=j
              full=(1<<N)-1;end=min(range(N),key=lambda j:dp[(full,j)])
              total=dp[(full,end)];path=[];mask=full;j=end
              while True:
                  path.append(j)
                  if mask==(1<<j):break
                  pj=par[(mask,j)];mask^=1<<j;j=pj
              path=path[::-1];order=[nodes[i] for i in path]
              vals=[]
              for i in range(N):
                  for j in range(i+1,N):vals.append((W[i][j],nodes[i],nodes[j]))
              vals.sort();mean=sum(x[0] for x in vals)/len(vals);p90=vals[int(.9*(len(vals)-1))][0];mx,a,b=max(vals)
              print(f"ROUTE|{t}|n={N}|open_path={total:.1f}m|mean={mean:.1f}m|p90={p90:.1f}m|max={mx:.1f}m|maxpair={a}-{b}")
              print(f"ORDER|{t}|"+",".join(map(str,order)))
              print("ORDER_NAMES|%s|%s"%(t," -> ".join(f"{num}:{bynum[num][2]}" for num in order)))
          PY
          python3 /tmp/final.py
