name: Diagnose Yandex Maps API
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-yandex.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Yandex JS API v3 and 2.1
        shell: bash
        run: |
          set +e
          KEY=$(grep -o 'apikey=[^&"]*' mfc-map/index.html | head -1 | cut -d= -f2)
          for VERSION in v3 2.1; do
            if [ "$VERSION" = "v3" ]; then
              URL="https://api-maps.yandex.ru/v3/?apikey=$KEY&lang=ru_RU"
            else
              URL="https://api-maps.yandex.ru/2.1/?apikey=$KEY&lang=ru_RU"
            fi
            echo "=== $VERSION ==="
            curl -sS -D /tmp/h -o /tmp/b -H 'Referer: https://texas359-art.github.io/corporation-rs-site/mfc-map/' "$URL"
            head -1 /tmp/h
            head -c 160 /tmp/b
            echo
          done
