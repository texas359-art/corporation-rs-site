name: Diagnose Yandex Maps API
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-yandex.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS API and Geocoder products
        shell: bash
        run: |
          set +e
          KEY=$(grep -o 'apikey=[^&"]*' mfc-map/index.html | head -1 | cut -d= -f2)
          echo '=== JS API 2.1 ==='
          curl -sS -D /tmp/h1 -o /tmp/b1 -H 'Referer: https://texas359-art.github.io/corporation-rs-site/mfc-map/' "https://api-maps.yandex.ru/2.1/?apikey=$KEY&lang=ru_RU"
          head -1 /tmp/h1
          head -c 120 /tmp/b1; echo
          echo '=== GEOCODER ==='
          curl -sS -D /tmp/h2 -o /tmp/b2 "https://geocode-maps.yandex.ru/v1/?apikey=$KEY&geocode=Moscow&format=json"
          head -1 /tmp/h2
          head -c 500 /tmp/b2; echo

